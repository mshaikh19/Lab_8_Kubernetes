name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Build Docker image
        run: docker build --tag ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          for service in api-gateway user-service product-service order-service; do
            image="${REGISTRY}/${IMAGE_PREFIX}/${service}:${GITHUB_SHA}"
            docker build -t "$image" "./$service"
            docker push "$image"
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: kubernetes
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
      - name: Update images and wait for rollout
        run: |
          for service in api-gateway user-service product-service order-service; do
            kubectl -n lab8 set image deployment/$service $service=${REGISTRY}/${IMAGE_PREFIX}/${service}:${GITHUB_SHA}
            kubectl -n lab8 rollout status deployment/$service --timeout=180s
          done
